apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: clinic-booking
  labels:
    app.kubernetes.io/name: clinic-booking
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clinic-booking
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-booking
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: clinic-booking-app:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # imagePullSecrets intentionally omitted here — minikube loads images
      # straight into its own Docker daemon, no registry auth needed.
      # overlays/prod adds this back in via a patch once a real registry
      # is in the picture.
