apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: clinic-booking
  labels:
    app.kubernetes.io/name: clinic-booking
    app.kubernetes.io/component: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinic-booking
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-booking
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName intentionally omitted here — this uses whatever
        # StorageClass is marked default on the cluster. minikube's default
        # is named "standard", so dev needs no override. overlays/prod
        # patches this in explicitly once you know your cloud provider's
        # StorageClass name.
