apiVersion: batch/v1
kind: Job
metadata:
  name: clinic-migrate
  namespace: clinic-booking
  labels:
    app.kubernetes.io/name: clinic-booking
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-booking
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: clinic-booking-app:latest
          command:
            - sh
            - -c
            - python manage.py migrate --no-input && python manage.py collectstatic --no-input
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
