apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 3
  template:
    spec:
      # Create with: kubectl create secret docker-registry registry-credentials
      #   --docker-server=... --docker-username=... --docker-password=... -n clinic-booking
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: app
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
