apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: clinic-booking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - REPLACE_WITH_YOUR_DOMAIN
      secretName: app-tls
  rules:
    - host: REPLACE_WITH_YOUR_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8000
